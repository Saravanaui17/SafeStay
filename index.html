<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c62828">
<meta name="description" content="SafeStay: real-time multi-hazard alerts, arrival ETA and step-by-step safety guidance for tourists. CAP-aligned, multilingual, works on low bandwidth.">
<title>SafeStay – Tourist Disaster Alerts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header>
    <h1>🛟 SafeStay</h1>
    <div id="tag" class="sub"></div>
  </header>
  <section class="card" id="ctl">
    <div class="row"><select id="lang" aria-label="Language"></select><button id="loc" class="p"></button></div>
    <div class="row"><div class="srch"><input id="city" type="search" autocomplete="off" aria-label="City search" aria-controls="cres"><ul id="cres" hidden></ul></div><select id="demo" aria-label="Demo scenario"></select></div>
    <label class="chk"><input type="checkbox" id="low"> <span id="lowl"></span></label>
    <div class="mu" id="lowh"></div>
    <div id="status" class="mu" role="status" aria-live="polite"></div>
  </section>
  <div id="out"></div>
  <noscript><div class="card">SafeStay needs JavaScript. Emergency number: 112 (GSM) / 911 (Americas).</div></noscript>
</main>
<script src="js/i18n.js"></script>
<script src="js/i18n2.js"></script>
<script src="js/cap.js"></script>
<script src="js/sources.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
